name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check and test the harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Install
        run: uv sync --locked --python 3.12

      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy

      - name: Pytest
        run: uv run --locked pytest
