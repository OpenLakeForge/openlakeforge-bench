name: diagnose-trino

# One Slim deploy of an OpenLakeForge ref, then the same Trino query three ways, to tell a harness mistake from a
# platform one (the 7 Nov benchmark run: "Trino answered HTTP 401" for the whole first-query window). Started by hand.
on:
  workflow_dispatch:
    inputs:
      openlakeforge_ref:
        description: OpenLakeForge branch, tag or commit to deploy
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  diagnose:
    name: Trino 401 on ${{ inputs.openlakeforge_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/bench
    defaults:
      run:
        working-directory: openlakeforge

    steps:
      - name: Checkout the harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: bench

      - name: Checkout OpenLakeForge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: OpenLakeForge/openlakeforge
          ref: ${{ inputs.openlakeforge_ref }}
          path: openlakeforge

      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge
          key: olf-toolchain-${{ hashFiles('openlakeforge/release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      - name: Deploy Slim
        run: uv run --project tools/olf --locked olf infra deploy --provider local --cluster-name openlakeforge-local

      # The CLI's own path: its profile file, its contract handling.
      - name: "Probe 1: olf infra query"
        if: ${{ always() }}
        continue-on-error: true
        run: uv run --project tools/olf --locked olf infra query "SELECT 1" -f openlakeforge.yaml 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # The harness's path: its session, olf's trino_query.
      - name: "Probe 2: the harness's session"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          uv run --project tools/olf --locked python ../bench/scripts/diagnose_trino.py 2>&1 | tee diagnose.txt
          { echo '```'; cat diagnose.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          KUBECONFIG=$(find . -path '*/.tmp/kubeconfigs/*.yaml' -print -quit 2>/dev/null || true)
          export KUBECONFIG
          uv run --project tools/olf --locked olf infra diagnostics collect "$GITHUB_WORKSPACE/diag/stage"
          uv run --project tools/olf --locked olf infra diagnostics collect "$GITHUB_WORKSPACE/diag/olf-system" --namespace olf-system

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnose-trino-${{ github.run_id }}
          path: |
            diag
            openlakeforge/diagnose.txt
          if-no-files-found: warn
          retention-days: 30
